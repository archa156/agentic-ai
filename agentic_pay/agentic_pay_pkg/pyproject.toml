[project]
name = "agentic-pay"
version = "0.1.0"
description = "Agentic AI payment verification: agent-as-constrained-prover with Pedersen commitments, ZK range proofs, and cvc5 SMT policy."
requires-python = ">=3.10"
dependencies = ["rbcl>=1.1", "cvc5>=1.3"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"
